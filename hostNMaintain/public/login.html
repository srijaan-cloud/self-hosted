<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — HostNMaintain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      backdrop-filter: blur(10px); box-shadow: var(--shadow-glow);
      padding: 36px 32px; width: 100%; max-width: 380px; text-align: center;
    }
    .login-brand { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
    .login-sub { color: var(--ink-soft); font-size: 0.88rem; margin-bottom: 26px; }
    .login-error { color: #f87171; font-size: 0.85rem; margin-top: 14px; }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #3c4043; border: 1px solid #dadce0;
      text-transform: none; letter-spacing: normal; font-weight: 600;
    }
    .btn-google:hover { background: #f7f8f8; }
    .login-back { display: inline-block; margin-top: 22px; font-size: 0.82rem; color: var(--ink-faint); }
    .login-back:hover { color: var(--ink-soft); }
    .otp-input {
      width: 100%; text-align: center; font-size: 1.4rem; letter-spacing: 0.4em; font-weight: 700;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--ink); padding: 12px; margin-bottom: 14px; font-family: inherit;
    }
    .otp-input:focus { outline: none; border-color: var(--violet); }
    .otp-resend { display: inline-block; margin-top: 14px; font-size: 0.82rem; color: var(--ink-soft); cursor: pointer; background: none; border: none; font-family: inherit; }
    .otp-resend:hover { color: var(--ink); }
    .login-success { color: #4ade80; font-size: 0.85rem; margin-top: 14px; }
  </style>
</head>
<body>
  <canvas id="magic-canvas" aria-hidden="true"></canvas>
  <div class="aurora aurora-1" aria-hidden="true"></div>
  <div class="aurora aurora-2" aria-hidden="true"></div>
  <div class="aurora aurora-3" aria-hidden="true"></div>

  <div class="login-screen">
    <div class="login-card">
      <div id="google-step">
        <div class="login-brand">✨ HostNMaintain Admin</div>
        <p class="login-sub">Sign in to manage leads and site content.</p>
        <a class="btn btn-google" href="/auth/google">
          <span aria-hidden="true">
            <svg viewBox="0 0 18 18" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
          </span>
          <span>Sign in with Google</span>
        </a>
        <p class="login-error" id="login-error" hidden></p>
      </div>

      <form id="otp-step" hidden>
        <div class="login-brand">✨ Check your email</div>
        <p class="login-sub">Enter the 6-digit code we just sent to your inbox.</p>
        <input id="otp-code" class="otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" />
        <button type="submit" class="btn btn-glow btn-wide" id="otp-submit">Verify &amp; Continue</button>
        <button type="button" class="otp-resend" id="otp-resend">Resend code</button>
        <p class="login-error" id="otp-error" hidden></p>
        <p class="login-success" id="otp-success" hidden></p>
      </form>

      <a class="login-back" href="/">← Back to site</a>
    </div>
  </div>

  <script>
    const ERROR_MESSAGES = {
      disabled: 'Google login is currently turned off for this site.',
      expired: 'Sign-in session expired — please try again.',
      failed: 'Google sign-in failed — please try again.',
    };
    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    if (err && ERROR_MESSAGES[err]) {
      const el = document.getElementById('login-error');
      el.textContent = ERROR_MESSAGES[err];
      el.hidden = false;
    }

    if (params.get('step') === 'verify') {
      document.getElementById('google-step').hidden = true;
      const otpStep = document.getElementById('otp-step');
      otpStep.hidden = false;
      const codeInput = document.getElementById('otp-code');
      const otpError = document.getElementById('otp-error');
      const otpSuccess = document.getElementById('otp-success');
      const submitBtn = document.getElementById('otp-submit');
      codeInput.focus();

      otpStep.addEventListener('submit', async (e) => {
        e.preventDefault();
        otpError.hidden = true;
        submitBtn.disabled = true;
        try {
          const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: codeInput.value.trim() }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Verification failed');
          location.href = '/admin.html';
        } catch (err) {
          otpError.textContent = err.message;
          otpError.hidden = false;
          submitBtn.disabled = false;
        }
      });

      document.getElementById('otp-resend').addEventListener('click', async () => {
        otpError.hidden = true;
        otpSuccess.hidden = true;
        try {
          const res = await fetch('/api/auth/resend-otp', { method: 'POST' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Could not resend the code');
          otpSuccess.textContent = 'Code resent — check your email.';
          otpSuccess.hidden = false;
        } catch (err) {
          otpError.textContent = err.message;
          otpError.hidden = false;
        }
      });
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
