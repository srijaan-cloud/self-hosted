name = "tapasya-constructions"
main = "server/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# Without this, Cloudflare serves matching static files (including index.html) directly,
# bypassing the Worker entirely — which would skip our login gate. This forces every
# request through server/index.js first; it decides itself when to fall back to ASSETS.
run_worker_first = true
html_handling = "none"

[[routes]]
pattern = "tapasyaconstructions.klmn2.com"
custom_domain = true

[vars]
PUBLIC_BASE_URL = "https://tapasyaconstructions.klmn2.com"
# Reuses the same Google OAuth client as kids-timetable-worker — its redirect URI
# list needs "https://tapasyaconstructions.klmn2.com/auth/google/callback" added
# in Google Cloud Console. GOOGLE_CLIENT_SECRET is set separately via
# `npx wrangler secret put GOOGLE_CLIENT_SECRET` (this Worker's own secret, even
# though the client ID is shared).
GOOGLE_CLIENT_ID = "980056554331-55l48p5mifq9fv9no7a3gf1hl4dko54i.apps.googleusercontent.com"
# Sender for one-time-code emails, sent via Resend (RESEND_API_KEY secret, set via
# `npx wrangler secret put RESEND_API_KEY`). Domain must be verified in Resend.
RESEND_FROM_EMAIL = "Tapasya Constructions <login@klmn2.com>"

[[d1_databases]]
binding = "DB"
database_name = "tapasya-constructions"
database_id = "bb3c356b-cfb8-4f29-8c53-49896d8b87f7"

# Session storage (same pattern as kids-timetable-worker).
[[kv_namespaces]]
binding = "KV"
id = "60885e0d32e64732aa1fa9287872f709"

# Bill/receipt/site-photo uploads.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "tapasya-constructions-uploads"
