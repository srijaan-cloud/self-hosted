name = "tapasya-constructions"
main = "server/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# Without this, Cloudflare serves matching static files (including index.html) directly,
# bypassing the Worker entirely — which would skip our login gate. This forces every
# request through server/index.js first; it decides itself when to fall back to ASSETS.
run_worker_first = true
html_handling = "none"

[[routes]]
pattern = "tapasyaconstructions.klmn2.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "tapasya-constructions"
database_id = "bb3c356b-cfb8-4f29-8c53-49896d8b87f7"

# Session storage (same pattern as kids-timetable-worker).
[[kv_namespaces]]
binding = "KV"
id = "60885e0d32e64732aa1fa9287872f709"

# Bill/receipt/site-photo uploads. R2 isn't enabled on this Cloudflare account yet —
# enable it at dash.cloudflare.com -> R2, then run:
#   npx wrangler r2 bucket create tapasya-constructions-uploads
# and uncomment this block.
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "tapasya-constructions-uploads"
